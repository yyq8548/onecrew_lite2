<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>onecrew_lite card version notice</title>
    <style>
      :root { color-scheme: light dark; font-family: ui-sans-serif, system-ui, sans-serif; }
      html,body,#root{margin:0;scrollbar-width:none}
      html::-webkit-scrollbar,body::-webkit-scrollbar,#root::-webkit-scrollbar{display:none}
      /* The notice stays readable in a frame too short for it: `overflow` on
         the root propagates to the viewport, so suppressing it there would
         clip the sentence away instead of letting it be scrolled to. */
      body { background: transparent; color: CanvasText; overflow-x: hidden; overflow-y: auto; }
      main { border: 1px solid color-mix(in srgb, CanvasText 18%, transparent); border-radius: 14px; padding: 18px; }
      h1 { font-size: 15px; margin: 0; }
      p { color: color-mix(in srgb, CanvasText 62%, transparent); font-size: 13px; line-height: 1.6; margin: 6px 0 0; }
    </style>
  </head>
  <body>
    <main id="root" role="status">
      <h1>卡片版本不兼容</h1>
      <p>此历史状态已不可用。请到 onecrew_lite 工作台查看最新进度，完成目标设置、选择和确认。</p>
    </main>
    <script type="module" src="/main.ts"></script>
  </body>
</html>
