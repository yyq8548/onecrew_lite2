name: TypeScript native candidates
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: typescript-candidates-${{ github.ref }}
  cancel-in-progress: false
jobs:
  candidate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            target: win32-x64
          - runner: macos-15
            target: darwin-arm64
          - runner: macos-15-intel
            target: darwin-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 26.7.0
      - name: Install package manager
        run: npm install --global pnpm@10.32.1
      - name: Prepare Windows native tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vsInstall = & "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe" -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          Import-Module "$vsInstall/Common7/Tools/Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $vsInstall -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'
          "C:/Program Files/NASM" | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Prepare Mac native tools
        if: runner.os == 'macOS'
        run: brew install cmake ninja nasm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Check source independence
        run: pnpm check:independence
      - name: Build paired web resources
        run: |
          pnpm build:ui
          pnpm build:tables
      - name: Check application and contracts
        run: |
          pnpm typecheck
          pnpm check:contracts
      - name: Build standalone candidate
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          test "$(node -p 'process.platform+"-"+process.arch')" = "$TARGET"
          pnpm build:candidate --output "dist/native-candidates/$TARGET" --product-version 0.7.1 --target "$TARGET" --node "$(node -p 'process.execPath')" --web-assets onecrew_lite-web/dist --library-web-assets onecrew_lite-library/web/dist
      - name: Run TypeScript and adapter tests
        env:
          ONECREW_SEA_CANDIDATE_EXECUTABLE: ${{ github.workspace }}/dist/native-candidates/${{ matrix.target }}/${{ runner.os == 'Windows' && 'onecrew_lite.exe' || 'onecrew_lite' }}
          ONECREW_OPENCLI_TEST_INSTALLATION: '1'
        run: |
          pnpm test:app
          pnpm test:opencli
          pnpm --filter onecrew-web test
          pnpm --filter onecrew-mcp-ui check
          pnpm --filter onecrew-mcp-ui test
          pnpm test:tables
          pnpm --filter onecrew_lite_tables test:discovery-projection
      - uses: actions/upload-artifact@v4
        with:
          name: typescript-candidate-${{ matrix.target }}-pending-native-acceptance
          path: |
            dist/native-candidates/${{ matrix.target }}/*.zip
            dist/native-candidates/${{ matrix.target }}/runtime-manifest.json
            dist/native-candidates/${{ matrix.target }}/archive.json
          if-no-files-found: error
