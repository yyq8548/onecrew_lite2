#:schema node_modules/wrangler/config-schema.json
name = "access"
main = "src/index.ts"
compatibility_date = "2026-08-26"
compatibility_flags = ["enable_request_signal"]

workers_dev = false
preview_urls = false

[[routes]]
pattern = "access.onecrewai.io"
custom_domain = true

[[ratelimits]]
name = "EDGE_RATE_LIMITER"
namespace_id = "93010001"
simple = { limit = 120, period = 60 }

[assets]
directory = "./web/dist/access"
binding = "ASSETS"
not_found_handling = "none"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "access"
database_id = "c373bd25-4aef-4b00-96e0-b88d95133f9f"
migrations_dir = "migrations"

[[services]]
binding = "CREATOR_SYNC_DEVICE_REVOCATION"
service = "sync"
entrypoint = "CreatorSyncDeviceRevocation"

[[services]]
binding = "SYNC_CREDENTIAL_VERIFIER"
service = "sync"

[[r2_buckets]]
binding = "RELEASES"
bucket_name = "onecrew-releases"

[triggers]
crons = ["*/5 * * * *"]

# Additional secrets: RELEASE_LINK_SECRET (independent 32-byte base64url),
# RELEASE_PUBLISHER_TOKEN (independent high-entropy bearer). Never reuse auth/pairing secrets.
[vars]
# Set CLI_RELEASE_VERSION only after all three CLI objects and cli-manifest.json are verified in R2.
CLI_RELEASE_VERSION = "0.6.2"
ACCESS_ORIGIN = "https://access.onecrewai.io"
BETTER_AUTH_URL = "https://access.onecrewai.io"
WEB_ORIGIN = "https://access.onecrewai.io"
CREATOR_SYNC_API_ORIGIN = "https://api.onecrewai.io"
RESEND_FROM_EMAIL = "OneCrew <noreply@notify.onecrewai.io>"
