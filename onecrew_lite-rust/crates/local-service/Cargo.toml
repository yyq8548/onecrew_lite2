[package]
name = "onecrew-local-service"
version = "0.7.0"
edition = "2024"
rust-version.workspace = true
publish.workspace = true
description = "OneCrew shared local service, web API and application lifecycle"

[lints]
workspace = true

[dependencies]
onecrew-access-client = { path = "../access-client" }
onecrew-local-vault = { path = "../local-vault" }
onecrew-codex = { path = "../codex" }
onecrew-local-runtime = { path = "../platform-runtime" }
onecrew-local-domain = { path = "../domain" }
onecrew-creator-runtime = { path = "../creator-runtime" }
onecrew-creator-sync = { path = "../creator-sync" }
onecrew-mcp-adapter = { path = "../mcp-adapter" }
axum.workspace = true
base64.workspace = true
chrono.workspace = true
md5 = "0.8.1"
dirs.workspace = true
fslock.workspace = true
futures.workspace = true
log = "0.4"
rmcp.workspace = true
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
subtle.workspace = true
tokio = { workspace = true, features = ["io-util", "io-std", "process", "signal"] }
tokio-util.workspace = true
tempfile.workspace = true
url.workspace = true
uuid.workspace = true
zeroize.workspace = true
reqwest.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_Security", "Win32_Security_Authorization"] }

[dev-dependencies]
onecrew-creator-sync = { path = "../creator-sync", features = ["test-support"] }
onecrew-local-runtime = { path = "../platform-runtime", features = ["test-support"] }
onecrew-creator-runtime = { path = "../creator-runtime", features = ["test-support"] }
onecrew-schema-manifest = { path = "../schema-manifest" }
rusqlite.workspace = true
tempfile.workspace = true
schemars.workspace = true
tower = { version = "0.5", features = ["util"] }
