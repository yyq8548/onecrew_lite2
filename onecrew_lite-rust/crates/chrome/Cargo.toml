[package]
name = "onecrew-chrome"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
publish.workspace = true
description = "Launch the user's installed Google Chrome with a fresh per-profile user-data-dir for manual login, then read & decrypt its cookies — pure Rust, no CDP/automation."

[lints]
workspace = true

[dependencies]
log = "0.4"
onecrew-local-domain = { path = "../domain", default-features = false }
thiserror = { workspace = true }
rusqlite = { workspace = true }
aes = { workspace = true }
aes-gcm = { workspace = true }
base64 = { workspace = true }
cbc = { workspace = true }
pbkdf2 = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }
tokio = { workspace = true, features = ["process"] }
sha1 = { workspace = true }
sha2 = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# macOS keeps the cookie-encryption key in the login Keychain ("Chrome Safe
# Storage"); reading it needs security-framework. Other OSes don't link it.
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_Security_Cryptography",
  "Win32_Storage_FileSystem",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = { workspace = true }
