[package]
name = "onecrew-tg-transport"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
log = "0.4"
base64 = { workspace = true }
# `proxy` feature = SOCKS5 support via tokio-socks (grammers has no HTTP-proxy
# path); routes a profile's Telegram traffic through its 家宽.
grammers-client = { version = "0.10", features = ["proxy"] }
grammers-session = { version = "0.10", default-features = false, features = ["serde"] }
grammers-tl-types = "0.10"
png = { workspace = true }
qrcode = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
env_logger = "0.11"
