[package]
name = "onecrew-proxy"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
publish.workspace = true
description = "Residential (家宽) proxy config + egress-IP probe, shared across the workspace."

[lints]
workspace = true

[features]
# `net` pulls the HTTP client for probing + the local proxy forwarder; leave it
# off (e.g. in the pure `domain` model crate) to depend on just the ProxyConfig
# type without reqwest/tokio.
default = ["net"]
net = ["dep:reqwest", "dep:serde_json", "dep:tokio", "dep:base64", "dep:chrono", "dep:chrono-tz"]

[dependencies]
log = "0.4"
serde = { workspace = true }
schemars = { workspace = true }
thiserror = { workspace = true }
reqwest = { workspace = true, optional = true, features = ["socks"] }
serde_json = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }
chrono-tz = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true }
