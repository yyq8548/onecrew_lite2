[package]
name = "onecrew"
version = "0.7.0"
edition = "2024"
rust-version.workspace = true
publish.workspace = true
description = "OneCrew CLI and stdio bridge"

[lints]
workspace = true

[dependencies]
onecrew-access-client = { path = "../access-client" }
onecrew-codex = { path = "../codex" }
onecrew-local-service = { path = "../local-service" }
onecrew-local-vault = { path = "../local-vault" }
onecrew-opencli = { path = "../opencli" }
onecrew-creator-sync = { path = "../creator-sync" }
dirs.workspace = true
reqwest.workspace = true
serde.workspace = true
sha2.workspace = true
tempfile.workspace = true
url.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "io-std", "process", "signal"] }

[dev-dependencies]
tempfile.workspace = true

[[bin]]
name = "onecrew_lite"
path = "src/main.rs"
