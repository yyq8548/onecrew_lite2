[workspace]
resolver = "2"
members = [
  "crates/onecrew",
  "crates/access-client",
  "crates/local-service",
  "crates/codex",
  "crates/domain",
  "crates/proxy",
  "crates/chrome",
  "crates/creator-sync",
  "crates/dm-contracts",
  "crates/email-contracts",
  "crates/gmail-platform",
  "crates/local-vault",
  "crates/platform-sessions",
  "crates/schema-manifest",
  "crates/mcp-adapter",
  "crates/platform-runtime",
  "crates/opencli",
  "crates/creator-runtime",
  "crates/x-transport",
  "crates/x-client",
  "crates/x-chat",
  "crates/x-platform",
  "crates/ig-transport",
  "crates/ig-client",
  "crates/ig-platform",
  "crates/tg-transport",
  "crates/tg-client",
  "crates/tg-platform",
  "crates/youtube-transport",
  "crates/youtube-client",
  "crates/youtube-platform",
  "crates/email-platform",
]
exclude = [
  "libs/chat-xdk",
  "libs/juicebox-sdk",
]

[workspace.package]
rust-version = "1.98.0"
publish = false

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unreachable_pub = "deny"
unused_must_use = "deny"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
invalid_html_tags = "deny"
missing_crate_level_docs = "deny"
private_intra_doc_links = "deny"

[workspace.lints.clippy]
allow_attributes_without_reason = "deny"
dbg_macro = "deny"
float_cmp = "deny"
let_underscore_future = "deny"
let_underscore_must_use = "deny"
too_many_arguments = "deny"
undocumented_unsafe_blocks = "deny"

# 发布二进制里没有调试信息(cargo release 本来就 debug = false),但符号表还在。
# 在 macOS arm64 上量过:75M -> 57M,行为零变化,代价只是崩溃回溯丢符号名。
#
# 这里刻意只放 strip 一项。lto / codegen-units / opt-level 都还能再省,但一次
# 改一样,下一次量出来的数才归得了因。
[profile.release]
# 只留 strip。它是链接之后的一步,不花编译时间,而且是这里唯一量证过的
# 收益(75M -> 57M)。
#
# 试过 lto = "fat" + codegen-units = 1,撤了:在这个 874 包的图上,它把所有
# 优化推到最后一个链接单元,打包卡在 898/900 好几分钟。而 dmg 已经是 19M
# 对 Windows 的 16M —— 没有体积问题要解决,拿每次打包的时间去换一个不需要
# 的收益不划算。真要再挤,lto = "thin" 是便宜得多的一档,一行就能加回来。
strip = "symbols"

[workspace.dependencies]
async-trait = "0.1"
aes-gcm = "0.10"
aes = "0.8"
axum = "0.8"
hmac = "0.12"
base64 = "0.22"
cbc = { version = "0.1", features = ["alloc"] }
# IANA timezone → numeric UTC offset (DST-aware), for aligning the IG session's
# X-IG-Timezone-Offset to the 家宽 egress region instead of hardcoding 0/UTC.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
chrono-tz = "0.10"
calamine = { version = "=0.36.1", default-features = false }
dirs = "6"
futures = "0.3"
fslock = "0.2"
fs2 = "0.4"
# CLDR likely-subtags: derive a region's primary language (country → language)
# without a hand-maintained table. `compiled_data` (default) bakes the data in.
icu_locale = "2"
pbkdf2 = "0.12"
png = "0.18"
qrcode = { version = "0.14", default-features = false }
quick-xml = { version = "=0.41.0", default-features = false, features = ["encoding"] }
rand = "0.8"
regex = "1"
scraper = "0.23"
# 一个版本,不是三个。0.13 把 rustls feature 从 "rustls-tls" 改名成 "rustls"。
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "system-proxy"] }
rmcp = { version = "3.1.2", features = [
  "client",
  "elicitation",
  "request-state",
  "transport-io",
  "transport-async-rw",
  "transport-streamable-http-client-reqwest",
  "transport-streamable-http-server",
] }
rusqlite = { version = "=0.40.2", features = ["backup", "bundled", "fallible_uint"] }
rust_xlsxwriter = { version = "=0.99.0", default-features = false, features = ["constant_memory"] }
r2d2_sqlite = "=0.35.0"
r2d2 = "=0.8.10"
schemars = "1"
security-framework = "3"
security-framework-sys = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
subtle = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time", "test-util"] }
tokio-util = "0.7"
url = "2"
uuid = { version = "1", features = ["serde", "v4"] }
windows-sys = "0.61"
zeroize = "1"
zip = { version = "=8.6.0", default-features = false, features = ["deflate"] }

[patch.crates-io]
thrift = { git = "https://github.com/apache/thrift.git", rev = "deb36fa409849de45973b04ffc3ce49d277ca90a" }
