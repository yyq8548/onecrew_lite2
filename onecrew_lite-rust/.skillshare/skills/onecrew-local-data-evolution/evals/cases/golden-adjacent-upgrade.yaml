id: local-data-golden-adjacent-upgrade
type: golden
prompt: Add a required field to a potentially persisted Creator SQLite shape used by a released build.
expected:
  must_include:
    - classify release and storage evidence before implementation
    - append one immutable adjacent migration and update fresh construction
    - preserve facts with preflight backup transaction and postflight validation
    - route user-confirmed upgrade through Web and run the final matrix
  must_not_include:
    - add a serde default or optional compatibility field
    - modify an old migration or version marker in place
score:
  pass: 90
  critical_fail_if:
    - destructive reset is authorized without positive evidence
    - a migration is exposed through MCP
