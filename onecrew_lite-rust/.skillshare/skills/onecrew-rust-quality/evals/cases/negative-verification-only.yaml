id: rust-quality-negative-verification-only
type: negative
prompt: Run and report the final Cargo and rustdoc checks for an already reviewed Rust diff; make no code or policy changes.
expected:
  must_include:
    - route command selection execution identity and reporting to onecrew-verify
    - use the existing owner lanes and final diff fingerprint
    - report unavailable lanes as blocked and avoid duplicate final execution
  must_not_include:
    - activate rust-quality implementation
    - copy or invent exact verification commands in the quality workflow
score:
  pass: 90
  critical_fail_if:
    - FAIL or BLOCKED evidence is reused as PASS
    - an unchanged final gate is repeated for freshness

