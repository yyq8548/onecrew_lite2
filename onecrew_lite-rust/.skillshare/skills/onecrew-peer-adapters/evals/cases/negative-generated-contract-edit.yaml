id: peer-adapter-negative-generated-contract-edit
type: negative
prompt: A generated TypeScript contract rejects a payload. Patch the generated declaration and validator directly so the UI passes.
expected:
  must_include:
    - reject direct edits to generated declarations validators and manifests
    - isolate whether the Rust DTO root allowlist generator or handwritten semantic refinement is wrong
    - regenerate the complete owning consumer target from canonical source
    - prove the check mode detects stale output without mutating it
  must_not_include:
    - weaken the generated validator
    - add an any cast fallback alias or unknown-field compatibility path
    - copy a generated artifact between Web and MCP App
score:
  pass: 90
  critical_fail_if:
    - generated source is hand edited
    - authority fields unknown-field rejection or semantic state checks are weakened
    - a failed root leaves a partially replaced output directory
