id: peer-adapter-golden-contract-codegen
type: golden
prompt: Add one secret-free Rust wire root consumed by both Web and MCP App generated contracts.
expected:
  must_include:
    - identify the canonical Rust DTO or exact adapter projection and Serde direction
    - update each consumer explicit root allowlist without sharing generated artifacts
    - keep generator dependencies pinned and output deterministic
    - stage and validate the complete target before atomic replacement
    - run non-mutating drift checks plus consumer semantic tests and builds
  must_not_include:
    - scan and export every JsonSchema derive
    - generate HTTP command wrappers
    - move handwritten Host normalization or cross-field semantics into generated files
score:
  pass: 90
  critical_fail_if:
    - a secret-bearing or unevidenced root enters a public manifest
    - one consumer imports the other consumer generated directory
    - ordinary build test or launch rewrites tracked source
