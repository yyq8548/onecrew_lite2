id: peer-adapter-negative-widget-layout
type: negative
prompt: Change only the spacing and focus behavior of an existing apps/mcp-ui card; its resource and interaction contract are unchanged.
expected:
  must_include:
    - route the request to onecrew-web-ui
    - state that the public adapter contract is unchanged
    - preserve generated asset ownership
    - avoid loading MCP failure or registry procedures
  must_not_include:
    - modify an MCP operation or HTTP command
    - activate peer-adapter implementation work
score:
  pass: 90
  critical_fail_if:
    - product adapter code is changed without a contract delta
    - a generated HTML asset is hand edited
