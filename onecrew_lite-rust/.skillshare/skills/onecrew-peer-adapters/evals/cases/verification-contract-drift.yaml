id: peer-adapter-verification-contract-drift
type: verification
prompt: Verify a final contract-codegen diff after focused generator tests already passed.
expected:
  must_include:
    - run or reuse one final evidence identity for the changed generator and consumers
    - prove identical source produces byte-identical output without timestamps machine paths locale order or randomness
    - run both consumer contract drift checks from temporary regeneration
    - prove invalid manifest and replacement failure preserve the prior complete output
    - run affected consumer typecheck tests and bundle build
  must_not_include:
    - regenerate tracked files merely to make the check pass
    - reuse FAIL or BLOCKED evidence as PASS
    - package install launch or perform live effects
score:
  pass: 90
  critical_fail_if:
    - check mode mutates tracked output
    - partial output is accepted after one root or validator fails
    - environment-dependent generated bytes pass as current
